<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Protocol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; color: #333; font-family: sans-serif; }
        .container-fluid { padding: 20px 30px; }
        .log-card { background: #fff; border-radius: 8px; padding: 20px; border: 1px solid #dee2e6; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .status-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 5px; text-transform: uppercase; }
        .bg-escalated { background: #fff5f5; color: #e03131; border: 1px solid #ffc9c9; }
        .bg-completed { background: #f4fce3; color: #2f9e44; border: 1px solid #d8f5a2; }
        .content-cell { min-width: 250px; max-width: 600px; word-wrap: break-word; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.4; }
        .timestamp { color: #868e96; font-size: 0.8rem; white-space: nowrap; }
        .customer-cell { font-weight: 600; color: #495057; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="log-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold">Support Activity Log</h4>
            <span class="badge bg-dark">Total: {{ logs|length }}</span>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:10%">Time</th>
                        <th style="width:15%">Customer</th>
                        <th style="width:33%">Question</th>
                        <th style="width:33%">AI Response</th>
                        <th class="text-center" style="width:9%">Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td class="timestamp">{{ log.created_at.strftime('%H:%M:%S %d.%m.%y') }}</td>
                        <td class="customer-cell">{{ log.user_email }}</td>
                        <td><div class="content-cell">{{ log.message_text }}</div></td>
                        <td><div class="content-cell">{{ log.ai_answer }}</div></td>
                        <td class="text-center">
                            <span class="status-badge {% if log.status == 'ESCALATED' %}bg-escalated{% else %}bg-completed{% endif %}">
                                {{ log.status }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
